<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tópicos en IA para economistas · Portafolio de Proyectos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --card: #1c1c21;
    --border: #2a2a32;
    --accent: #e8c97e;
    --accent2: #7eb8e8;
    --accent3: #a8e87e;
    --text: #f0ede8;
    --muted: #888892;
    --tag-bg: #22222a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(232,201,126,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(126,184,232,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 1;
    padding: 4rem 2rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .course-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .course-label::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-bottom: 1rem;
  }
  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 300;
    max-width: 520px;
    line-height: 1.6;
  }

  /* ── STATS BAR ── */
  .stats {
    display: flex;
    gap: 2.5rem;
    margin-top: 2.5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }
  .stat-item { display: flex; flex-direction: column; gap: 0.2rem; }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--accent);
    line-height: 1;
    transition: all 0.3s;
  }
  .stat-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.05em; }

  /* ── FILTERS ── */
  .filters-section {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 2rem;
  }

  .filters-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  .filter-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-right: 0.5rem;
  }

  .filter-btn {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 0.45rem 1rem;
    border-radius: 2rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
    font-weight: 500;
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    margin-bottom: 1.5rem;
  }
  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }
  #search {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    border-radius: 0.5rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent2); }

  /* ── GRID ── */
  .grid-section {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 6rem;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    animation: fadeUp 0.4s ease both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent));
    transform: scaleX(0);
    transition: transform 0.3s;
    transform-origin: left;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); border-color: #3a3a45; }
  .card:hover::before { transform: scaleX(1); }
  .card.hidden { display: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }

  .card-icon {
    width: 40px; height: 40px;
    border-radius: 0.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
    background: var(--card-accent-bg, rgba(232,201,126,0.1));
  }

  .card-meta {
    display: flex; flex-direction: column; gap: 0.15rem; flex: 1;
  }
  .card-group {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--card-accent, var(--accent));
  }
  .card-date { font-size: 0.7rem; color: var(--muted); }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    line-height: 1.3;
    color: var(--text);
  }

  .card-desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.55;
    flex: 1;
  }

  .card-tags {
    display: flex; flex-wrap: wrap; gap: 0.4rem;
  }
  .tag {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    padding: 0.25rem 0.6rem;
    border-radius: 0.25rem;
    letter-spacing: 0.04em;
  }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 0.85rem;
    margin-top: auto;
  }

  .card-student { font-size: 0.8rem; color: var(--muted); }
  .card-student strong { color: var(--text); font-weight: 500; }

  .card-links { display: flex; gap: 0.5rem; }
  .link-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    padding: 0.3rem 0.65rem;
    border-radius: 0.25rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .link-btn:hover {
    border-color: var(--card-accent, var(--accent));
    color: var(--card-accent, var(--accent));
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: none;
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
  }
  .empty-state.show { display: block; }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.9rem; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1rem;
    max-width: 600px;
    width: 100%;
    padding: 2rem;
    position: relative;
    animation: modalIn 0.25s ease;
    max-height: 85vh;
    overflow-y: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { color: var(--text); border-color: var(--text); }

  .modal-group {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5rem;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    line-height: 1.2;
    margin-bottom: 1rem;
  }
  .modal-desc {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.65;
    margin-bottom: 1.5rem;
  }
  .modal-section { margin-bottom: 1.25rem; }
  .modal-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .modal-links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .modal-link-btn {
    background: var(--accent);
    color: #0e0e10;
    border: none;
    padding: 0.65rem 1.25rem;
    border-radius: 0.4rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .modal-link-btn:hover { opacity: 0.85; }
  .modal-link-btn.secondary {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .modal-link-btn.secondary:hover { color: var(--text); border-color: var(--text); }

  /* responsive */
  @media (max-width: 640px) {
    header { padding: 2.5rem 1.25rem 1.5rem; }
    .filters-section, .grid-section { padding-left: 1.25rem; padding-right: 1.25rem; }
    .stats { gap: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="course-label">Tópicos en IA para Economistas · 2026-10</div>
  <h1>Proyectos del <span>Curso</span></h1>
  <p class="subtitle">Proyectos de estudiantes: modelos de machine learning en política pública.</p>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">Proyectos</span>
    </div>
    <div class="stat-item">
      <span class="stat-num" id="group-count">0</span>
      <span class="stat-label">Grupos</span>
    </div>
    <div class="stat-item">
      <span class="stat-num" id="visible-count">0</span>
      <span class="stat-label">Mostrando</span>
    </div>
  </div>
</header>

<div class="filters-section">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar proyecto o estudiante…">
  </div>
  <div class="filters-row" id="filters">
    <span class="filter-label">Filtrar:</span>
    <button class="filter-btn active" data-filter="all">Todos</button>
  </div>
</div>

<div class="grid-section">
  <div class="projects-grid" id="grid">
    <div class="empty-state" id="empty">
      <div class="emoji">🔭</div>
      <p>No se encontraron proyectos con ese criterio.</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <button class="modal-close" onclick="closeModal(null, true)">✕</button>
    <div class="modal-group" id="m-group"></div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-desc" id="m-desc"></div>
    <div class="modal-section">
      <div class="modal-section-label">Integrantes</div>
      <div id="m-students" style="font-size:0.9rem; color:var(--text);"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">Temas</div>
      <div class="modal-tags" id="m-tags"></div>
    </div>
    <div class="modal-links" id="m-links"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// DATOS DE PROYECTOS — edita este arreglo para agregar/quitar proyectos
// ─────────────────────────────────────────────
const PROJECTS = [
  {
    id: 1,
    title: "Auditoría de Sesgo en Modelos de Crédito",
    group: "Grupo 1",
    students: ["Ana Martínez", "Carlos Ruiz"],
    date: "Mayo 2025",
    description: "Análisis de disparidades demográficas en un modelo de scoring crediticio usando métricas de equalized odds, calibración y mitigación con umbrales por grupo.",
    tags: ["Fairness", "Calibración", "Random Forest", "Política Pública"],
    icon: "⚖️",
    accentColor: "#e8c97e",
    accentBg: "rgba(232,201,126,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  },
  {
    id: 2,
    title: "LIME e Interpretabilidad Local en Subsidios",
    group: "Grupo 2",
    students: ["Laura Gómez", "Sebastián Torres", "Valentina Cruz"],
    date: "Mayo 2025",
    description: "Implementación y análisis de explicaciones locales con LIME para un modelo de asignación de subsidios. Exploran qué variables mueven el score para decisiones individuales.",
    tags: ["LIME", "Interpretabilidad", "Explicabilidad", "Subsidios"],
    icon: "🔍",
    accentColor: "#7eb8e8",
    accentBg: "rgba(126,184,232,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  },
  {
    id: 3,
    title: "Paridad Demográfica vs Equalized Odds",
    group: "Grupo 3",
    students: ["Miguel Herrera", "Sara Jiménez"],
    date: "Mayo 2025",
    description: "Exploración del teorema de imposibilidad: demuestran empíricamente por qué no se puede satisfacer simultáneamente calibración y equalized odds cuando los grupos tienen base rates distintas.",
    tags: ["Equalized Odds", "Calibración", "Imposibilidad", "Teoría"],
    icon: "📐",
    accentColor: "#a8e87e",
    accentBg: "rgba(168,232,126,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  },
  {
    id: 4,
    title: "Mitigación Post-proceso con Cupos Limitados",
    group: "Grupo 4",
    students: ["David Morales", "Isabela Vargas", "Felipe Castillo"],
    date: "Mayo 2025",
    description: "Evaluación de estrategias de post-procesamiento bajo restricciones de cupos (K fijo). Comparan umbrales únicos vs umbrales diferenciados por grupo en escenarios de política pública.",
    tags: ["Post-procesamiento", "Cupos", "Mitigación", "Umbrales"],
    icon: "🎯",
    accentColor: "#e87eb8",
    accentBg: "rgba(232,126,184,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  },
  {
    id: 5,
    title: "PDP y Dependencia Parcial en Becas",
    group: "Grupo 5",
    students: ["Natalia Peña", "Andrés López"],
    date: "Mayo 2025",
    description: "Uso de Partial Dependence Plots para comunicar el comportamiento del modelo a reguladores y ciudadanía. Análisis del efecto de ingresos, pagos tardíos y zona geográfica.",
    tags: ["PDP", "Interpretabilidad Global", "Comunicación", "Bosques"],
    icon: "📊",
    accentColor: "#b87ee8",
    accentBg: "rgba(184,126,232,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  },
  {
    id: 6,
    title: "Triangulación y Variables Proxy",
    group: "Grupo 6",
    students: ["Camila Ríos", "Juan Mendez", "Paula Ortiz"],
    date: "Mayo 2025",
    description: "Estudio sobre cómo variables proxy (zona geográfica) permiten inferir atributos protegidos aunque no estén explícitamente en el modelo. Análisis de AUC con y sin variable sensible.",
    tags: ["Proxy", "Triangulación", "Sesgo", "Regresión Logística"],
    icon: "🕵️",
    accentColor: "#e8a87e",
    accentBg: "rgba(232,168,126,0.1)",
    files: [
      { label: "📄 Informe PDF", url: "#" },
      { label: "💻 Notebook", url: "#" }
    ]
  }
];

// ─────────────────────────────────────────────
// LÓGICA DE FILTROS Y RENDERIZADO
// ─────────────────────────────────────────────
let activeFilter = "all";
let searchQuery = "";

function getGroups() {
  return [...new Set(PROJECTS.map(p => p.group))];
}

function buildFilters() {
  const container = document.getElementById("filters");
  const groups = getGroups();
  groups.forEach(g => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.filter = g;
    btn.textContent = g;
    btn.addEventListener("click", () => setFilter(g));
    container.appendChild(btn);
  });
}

function setFilter(val) {
  activeFilter = val;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.filter === val);
  });
  renderCards();
}

function isVisible(p) {
  const matchFilter = activeFilter === "all" || p.group === activeFilter;
  const q = searchQuery.toLowerCase();
  const matchSearch = !q ||
    p.title.toLowerCase().includes(q) ||
    p.students.some(s => s.toLowerCase().includes(q)) ||
    p.tags.some(t => t.toLowerCase().includes(q)) ||
    p.group.toLowerCase().includes(q);
  return matchFilter && matchSearch;
}

function renderCards() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  // Remove existing cards
  grid.querySelectorAll(".card").forEach(c => c.remove());

  let visible = 0;
  PROJECTS.forEach((p, i) => {
    if (!isVisible(p)) return;
    visible++;
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--card-accent", p.accentColor);
    card.style.setProperty("--card-accent-bg", p.accentBg);
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${p.icon}</div>
        <div class="card-meta">
          <span class="card-group">${p.group}</span>
          <span class="card-date">${p.date}</span>
        </div>
      </div>
      <div class="card-title">${p.title}</div>
      <div class="card-desc">${p.description.slice(0, 120)}…</div>
      <div class="card-tags">${p.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="card-footer">
        <div class="card-student"><strong>${p.students[0]}</strong>${p.students.length > 1 ? ` +${p.students.length - 1}` : ""}</div>
        <div class="card-links">
          ${p.files.slice(0,2).map(f => `<a class="link-btn" href="${f.url}" target="_blank" onclick="event.stopPropagation()">${f.label}</a>`).join("")}
        </div>
      </div>
    `;
    card.addEventListener("click", () => openModal(p));
    grid.insertBefore(card, empty);
  });

  empty.classList.toggle("show", visible === 0);
  document.getElementById("visible-count").textContent = visible;
}

// ─────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────
function openModal(p) {
  document.getElementById("m-group").textContent = p.group + " · " + p.date;
  document.getElementById("m-title").textContent = p.title;
  document.getElementById("m-desc").textContent = p.description;
  document.getElementById("m-students").innerHTML = p.students.map(s => `<span style="margin-right:1rem">👤 ${s}</span>`).join("");
  document.getElementById("m-tags").innerHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join("");
  document.getElementById("m-links").innerHTML = p.files.map((f, i) =>
    `<a class="modal-link-btn ${i > 0 ? 'secondary' : ''}" href="${f.url}" target="_blank">${f.label}</a>`
  ).join("");
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal(event, force = false) {
  if (force || event?.target === document.getElementById("modal-overlay")) {
    document.getElementById("modal-overlay").classList.remove("open");
  }
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(null, true); });

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderCards();
});

document.querySelector("[data-filter='all']").addEventListener("click", () => setFilter("all"));

buildFilters();
renderCards();

document.getElementById("total-count").textContent = PROJECTS.length;
document.getElementById("group-count").textContent = getGroups().length;
</script>
</body>
